; ARI (Asterisk REST Interface) — the Call Engine drives channels over this.
; Requires http.conf enabled (the REST + WebSocket transport). See ADR-0001.
;
; The [pizza] user's credentials must match the engine's ARI_USERNAME /
; ARI_PASSWORD (engine/__main__.py defaults to pizza / pizza). The Stasis
; application name is separate — it lives in the dialplan as Stasis(pizza-phone)
; and in the engine's ARI_APP; ARI users aren't bound to a single app.
;
; Change the password before any non-office deployment; plain HTTP on the LAN
; means it crosses the wire in the clear (CONTEXT.md, "Web dashboard auth").
;
; Deployment: copy to /etc/asterisk/ and `module reload res_ari` (see README).

[general]
enabled=yes
; Pretty-print JSON responses — handy when poking ARI by hand with curl.
pretty=yes

[pizza]
type=user
password=pizza
