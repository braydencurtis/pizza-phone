; Asterisk dialplan for Pizza Phone
; Routes inbound POTS calls from the Booth Phone into the ARI Call Engine
; (Stasis app "pizza-phone"), which drives the game and connects the caller to
; the Upstairs Phone on a successful code entry.
;
; Deployment: copy this file and pjsip.conf to /etc/asterisk/ and reload
; (see asterisk/README.md). The engine must be running and registered as the
; "pizza-phone" Stasis app; otherwise inbound channels have nowhere to go.

[general]
static=yes
writeprotect=yes
csvformat=comment,callers,destination,channel,dcontext,channeldest

; Inbound context for the Booth Phone (POTS via Grandstream HT814)
; Hands the channel to the ARI Call Engine. The engine answers, runs the mode,
; and either continues the channel into pizza-success (Dial upstairs) or hangs
; up. The trailing Hangup() is the fallback if the engine is down and the
; channel falls straight through Stasis().
[from-pots]
exten => _X.,1,NoOp(Pizza Phone inbound call from ${CALLERID(num)})
 same => n,Stasis(pizza-phone)
 same => n,Hangup()

; Success context — connected to Upstairs Phone
[pizza-success]
exten => s,1,NoOp(Connecting caller to Upstairs Phone extension ${UPSTREAM_EXT})
 same => n,Dial(PJSIP/${UPSTREAM_EXT},30)
 same => n,Hangup()

; Fail context — goodbye message
[pizza-fail]
exten => s,1,NoOp(Code entry failed, hanging up)
 same => n,Hangup()
