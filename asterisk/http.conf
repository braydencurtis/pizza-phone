; Asterisk built-in HTTP server — required transport for ARI (REST + the event
; WebSocket the Call Engine connects on). See ADR-0001.
;
; LAN-only, plain HTTP: the PBX and the engine run on the same office network
; (the engine defaults to http://localhost:8088). Never expose this port
; publicly — the console's auth story is LAN-only + Tailscale-if-needed
; (CONTEXT.md, "Web dashboard auth").
;
; Deployment: copy to /etc/asterisk/ and `module reload http` (see README).

[general]
enabled=yes
; Bind to all interfaces so the engine can reach ARI whether it runs on the
; PBX host or elsewhere on the LAN. Tighten to the LAN address if preferred.
bindaddr=0.0.0.0
bindport=8088
