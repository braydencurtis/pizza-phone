[project]
name = "pizza-phone"
version = "0.1.0"
description = "Backrooms-themed phone booth backend (ARI Call Engine)"
requires-python = ">=3.12"
# The ARI Call Engine (engine/) speaks ARI over REST + WebSocket. The
# channel-agnostic game logic (core/) and the operator CLIs (tools/) need no
# third-party runtime deps.
dependencies = [
    "aiohttp>=3.14",
    "websockets>=16",
]

[project.optional-dependencies]
# The checks a change is expected to pass: the suite, the type checker, the
# linter. Pinned only by lower bound — this is a hobby rig, not a fleet.
dev = ["pytest", "mypy", "ruff"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# Flat layout: the importable packages, spelled out so setuptools doesn't try
# to guess from the repo root (which also holds tests/, scripts/ and docs/).
packages = ["core", "engine", "tools"]

[tool.ruff]
# House style is ~100 columns, not ruff's default 88.
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
